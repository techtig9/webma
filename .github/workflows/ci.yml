name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30.x (this repo's Vitest test environment) declares
          # "engines": { "node": "^22.22.2 || ^24.15.0 || >=26.0.0" }, and its
          # own undici@8.10.0 dependency declares "engines": { "node":
          # ">=22.19.0" } — neither supports Node 20 at all. On Node 20,
          # undici's webidl shim (used by jsdom's Cache/CacheStorage
          # implementation) is missing APIs newer Node versions provide
          # internally, which is exactly the "webidl.util.markAsUncloneable
          # is not a function" crash this pin fixes. Node 22 satisfies both
          # packages' declared engines ranges; no jsdom/undici version change
          # needed.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build
        env:
          # Dummy values so `next build` can complete static analysis without real
          # secrets. Real deploys (Vercel) inject the actual environment variables —
          # this job only proves the app compiles, it never deploys anything.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Kept in sync with the build job's Node version above — this job
          # runs `npm ci` against the same lockfile (jsdom/undici devDeps
          # included even though Playwright doesn't use them), so there's no
          # reason for the two jobs to diverge.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests (unauthenticated pages, always runs)
        run: npx playwright test e2e/smoke.spec.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}

      # Only runs once E2E_TEST_EMAIL/PASSWORD/PROJECT_ID secrets exist for a
      # seeded Supabase *test* project (see e2e/generator-flow.spec.ts header)
      # — the spec skips itself gracefully without them, so this step is safe
      # to leave in before that project exists.
      - name: E2E authenticated generator flow (requires seeded test project)
        run: npx playwright test e2e/generator-flow.spec.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_TEST_PROJECT_ID: ${{ secrets.E2E_TEST_PROJECT_ID }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
